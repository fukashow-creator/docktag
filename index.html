<!-- 【バージョン: v1.5 - 2026/09/30】両面（表面・裏面）デザイン＆画像2枚生成対応 -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドックタグ名入れシミュレーター</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Great+Vibes&family=Noto+Sans+JP:wght@500;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans JP', sans-serif; }
    body { background-color: #f5f5f7; color: #333; padding: 10px; max-width: 600px; margin: 0 auto; }
    
    .sticky-preview {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: #f5f5f7;
      padding-top: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #ddd;
    }

    /* 表面/裏面 切替タブ */
    .side-tabs {
      display: flex; gap: 8px; margin-bottom: 8px;
    }
    .side-tab-btn {
      flex: 1; padding: 8px; font-size: 0.85rem; font-weight: bold; border: 1px solid #007aff;
      background: #fff; color: #007aff; border-radius: 6px; cursor: pointer; text-align: center;
    }
    .side-tab-btn.active {
      background: #007aff; color: #fff;
    }

    .preview-wrapper {
      width: 100%;
      aspect-ratio: 50 / 28;
      position: relative;
    }

    .preview-container {
      width: 100%;
      height: 100%;
      background-color: #e0e0e0;
      position: relative;
      border-radius: 12% / 50%;
      overflow: hidden;
      border: 2px solid #a0a0a0;
    }

    .printable-area {
      position: absolute;
      left: 4%; right: 4%; top: 7.1%; bottom: 7.1%;
      border: 1.5px dashed #ff3b30;
      border-radius: 8% / 40%;
      pointer-events: none;
      z-index: 3;
    }
    .printable-label {
      position: absolute;
      right: 8px; bottom: 4px;
      font-size: 0.6rem; color: #ff3b30; font-weight: bold;
      background: rgba(255,255,255,0.85); padding: 1px 4px; border-radius: 3px;
    }

    .tag-hole {
      position: absolute;
      left: 4%; top: 50%;
      transform: translateY(-50%);
      width: 6%; aspect-ratio: 1 / 1;
      border-radius: 50%; background-color: #f5f5f7;
      border: 1.5px solid #a0a0a0; z-index: 4;
    }

    .preview-container .engraved-line {
      position: absolute;
      color: #1a1a1a;
      white-space: nowrap;
      user-select: none;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 2;
      line-height: 1;
    }

    .scroll-controls { margin-top: 15px; }
    .control-panel, .form-panel {
      background: #fff; padding: 15px; border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 15px;
    }
    .panel-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 10px; border-left: 4px solid #333; padding-left: 8px; }
    
    .line-block {
      background: #fafafa; border: 1px solid #e0e0e0; padding: 12px; border-radius: 8px; margin-bottom: 12px;
    }
    .line-block-title { font-size: 0.85rem; font-weight: bold; color: #007aff; margin-bottom: 8px; }

    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 0.75rem; font-weight: bold; margin-bottom: 3px; color: #666; }
    .input-group input[type="text"], .input-group select {
      width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 5px; font-size: 0.85rem;
    }

    .line-selector { display: flex; gap: 15px; margin-bottom: 10px; }
    .line-selector label { display: flex; align-items: center; gap: 4px; font-size: 0.85rem; cursor: pointer; font-weight: bold; }
    
    .range-group { display: flex; align-items: center; gap: 8px; }
    .range-group input[type="range"] { flex: 1; }
    .range-group span { font-size: 0.75rem; width: 30px; text-align: right; }

    .zip-hint { font-size: 0.7rem; color: #007aff; margin-top: 2px; }
    .hidden { display: none !important; }

    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .btn-submit { background-color: #007aff; color: white; margin-top: 10px; }
    .btn-submit:disabled { background-color: #ccc; cursor: not-allowed; }

    /* モーダル（確認ダイアログ）スタイル */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 1000;
      display: flex; justify-content: center; align-items: center; padding: 15px;
    }
    .modal-content {
      background: #fff; border-radius: 12px; padding: 20px; max-width: 500px; width: 100%;
      max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .modal-title { font-size: 1.1rem; font-weight: bold; text-align: center; margin-bottom: 15px; }
    .modal-img-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .modal-img-wrapper { width: 100%; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; position: relative; }
    .modal-img-wrapper img { width: 100%; display: block; }
    .modal-img-tag { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.6); color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 3px; }
    .modal-info { font-size: 0.85rem; background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 15px; line-height: 1.5; }
    .modal-btns { display: flex; gap: 10px; }
    .btn-cancel { background-color: #8e8e93; color: white; }
    .btn-confirm { background-color: #28a745; color: white; }
  </style>
</head>
<body>

  <div class="sticky-preview">
    <!-- 表面・裏面 切り替えタブ -->
    <div class="side-tabs hidden" id="sideTabContainer">
      <div class="side-tab-btn active" id="tabFrontBtn">表面を編集</div>
      <div class="side-tab-btn" id="tabBackBtn">裏面を編集</div>
    </div>

    <div class="preview-wrapper">
      <div class="preview-container" id="previewArea">
        <div class="printable-area"><span class="printable-label">加工可能範囲(内側2mm)</span></div>
        <div class="tag-hole"></div>
        <div class="engraved-line" id="linePrev1">1行目の文字</div>
        <div class="engraved-line hidden" id="linePrev2">2行目の文字</div>
        <div class="engraved-line hidden" id="linePrev3">3行目の文字</div>
      </div>
    </div>
  </div>

  <div class="scroll-controls">
    <div class="control-panel">
      <div class="panel-title">1. デザイン調整</div>
      
      <!-- 片面 / 両面 選択 -->
      <div class="input-group">
        <label>刻印面数</label>
        <div class="line-selector">
          <label><input type="radio" name="sideMode" value="single" checked> 片面のみ</label>
          <label><input type="radio" name="sideMode" value="double"> 両面（表面・裏面）</label>
        </div>
      </div>

      <div class="input-group">
        <label>表示する行数</label>
        <div class="line-selector">
          <label><input type="radio" name="lineCount" value="1" checked> 1行</label>
          <label><input type="radio" name="lineCount" value="2"> 2行</label>
          <label><input type="radio" name="lineCount" value="3"> 3行</label>
        </div>
      </div>

      <!-- 1行目の設定 -->
      <div class="line-block" id="blockLine1">
        <div class="line-block-title">【 1行目の設定 】</div>
        <div class="input-group">
          <label>テキスト</label>
          <input type="text" id="textInput1" value="YOUR TEXT" placeholder="1行目の文字">
        </div>
        <div class="input-group">
          <label>フォント</label>
          <select id="fontSelect1">
            <option value="'Noto Sans JP', sans-serif">ゴシック体（標準）</option>
            <option value="'Noto Serif JP', serif">明朝体（高級感）</option>
            <option value="'Cinzel', serif">英数スタイリッシュ</option>
            <option value="'Great Vibes', cursive">英数筆記体</option>
            <option value="monospace">タイプライター風</option>
          </select>
        </div>
        <div class="input-group">
          <label>文字サイズ (30〜100px)</label>
          <div class="range-group"><input type="range" id="sizeInput1" min="30" max="100" value="40"><span id="sizeVal1">40</span></div>
        </div>
        <div class="input-group">
          <label>左右位置</label>
          <div class="range-group"><input type="range" id="posXInput1" min="20" max="80" value="55"><span id="posXVal1">0</span></div>
        </div>
        <div class="input-group">
          <label>上下位置</label>
          <div class="range-group"><input type="range" id="posYInput1" min="20" max="80" value="50"><span id="posYVal1">0</span></div>
        </div>
      </div>

      <!-- 2行目の設定 -->
      <div class="line-block hidden" id="blockLine2">
        <div class="line-block-title">【 2行目の設定 】</div>
        <div class="input-group">
          <label>テキスト</label>
          <input type="text" id="textInput2" value="SECOND LINE" placeholder="2行目の文字">
        </div>
        <div class="input-group">
          <label>フォント</label>
          <select id="fontSelect2">
            <option value="'Noto Sans JP', sans-serif">ゴシック体（標準）</option>
            <option value="'Noto Serif JP', serif">明朝体（高級感）</option>
            <option value="'Cinzel', serif">英数スタイリッシュ</option>
            <option value="'Great Vibes', cursive" selected>英数筆記体</option>
            <option value="monospace">タイプライター風</option>
          </select>
        </div>
        <div class="input-group">
          <label>文字サイズ (30〜100px)</label>
          <div class="range-group"><input type="range" id="sizeInput2" min="30" max="100" value="35"><span id="sizeVal2">35</span></div>
        </div>
        <div class="input-group">
          <label>左右位置</label>
          <div class="range-group"><input type="range" id="posXInput2" min="20" max="80" value="55"><span id="posXVal2">0</span></div>
        </div>
        <div class="input-group">
          <label>上下位置</label>
          <div class="range-group"><input type="range" id="posYInput2" min="20" max="80" value="65"><span id="posYVal2">0</span></div>
        </div>
      </div>

      <!-- 3行目の設定 -->
      <div class="line-block hidden" id="blockLine3">
        <div class="line-block-title">【 3行目の設定 】</div>
        <div class="input-group">
          <label>テキスト</label>
          <input type="text" id="textInput3" value="THIRD LINE" placeholder="3行目の文字">
        </div>
        <div class="input-group">
          <label>フォント</label>
          <select id="fontSelect3">
            <option value="'Noto Sans JP', sans-serif">ゴシック体（標準）</option>
            <option value="'Noto Serif JP', serif">明朝体（高級感）</option>
            <option value="'Cinzel', serif" selected>英数スタイリッシュ</option>
            <option value="'Great Vibes', cursive">英数筆記体</option>
            <option value="monospace">タイプライター風</option>
          </select>
        </div>
        <div class="input-group">
          <label>文字サイズ (30〜100px)</label>
          <div class="range-group"><input type="range" id="sizeInput3" min="30" max="100" value="30"><span id="sizeVal3">30</span></div>
        </div>
        <div class="input-group">
          <label>左右位置</label>
          <div class="range-group"><input type="range" id="posXInput3" min="20" max="80" value="55"><span id="posXVal3">0</span></div>
        </div>
        <div class="input-group">
          <label>上下位置</label>
          <div class="range-group"><input type="range" id="posYInput3" min="20" max="80" value="80"><span id="posYVal3">0</span></div>
        </div>
      </div>

    </div>

    <!-- お届け先フォーム -->
    <div class="form-panel">
      <div class="panel-title">2. お届け先情報の入力</div>
      <div class="input-group"><label>お名前 *</label><input type="text" id="custName" required placeholder="山田 太郎"></div>
      <div class="input-group"><label>電話番号 *</label><input type="text" id="custPhone" required placeholder="090-0000-0000"></div>
      <div class="input-group">
        <label>郵便番号 * (ハイフンなし7桁で自動入力)</label>
        <input type="text" id="custZip" required placeholder="1234567" maxlength="8">
        <div id="zipStatus" class="zip-hint"></div>
      </div>
      <div class="input-group"><label>お届け先住所 *</label><input type="text" id="custAddress" required placeholder="郵便番号を入力すると自動検索されます"></div>
      <button class="btn btn-submit" id="openConfirmBtn">デザイン・注文内容を確認する</button>
    </div>
  </div>

  <!-- 送信確認モーダル -->
  <div class="modal-overlay hidden" id="confirmModal">
    <div class="modal-content">
      <div class="modal-title">ご注文内容の確認</div>
      <p style="font-size:0.8rem; color:#666; text-align:center; margin-bottom:10px;">以下の内容・完成デザインで注文を確定しますか？</p>
      
      <div class="modal-img-grid" id="modalImgGrid">
        <!-- JSで動的に画像を追加 -->
      </div>

      <div class="modal-info" id="modalInfoText"></div>

      <div class="modal-btns">
        <button class="btn btn-cancel" id="closeModalBtn">修正する</button>
        <button class="btn btn-confirm" id="finalSubmitBtn">この内容で注文確定</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxkwSlExzjPR_fLO-4aM7eWB7YTkrEZHYmGw_u68vnvKPxchfLjQBPmT_178UOxY_s/exec";

    let currentSide = "front"; // "front" or "back"
    let isDoubleSided = false;

    // 表面・裏面のデータを保持するオブジェクト
    const sideData = {
      front: {
        lineCount: 1,
        lines: [
          { text: "YOUR TEXT", font: "'Noto Sans JP', sans-serif", size: 40, posX: 55, posY: 50 },
          { text: "SECOND LINE", font: "'Great Vibes', cursive", size: 35, posX: 55, posY: 65 },
          { text: "THIRD LINE", font: "'Cinzel', serif", size: 30, posX: 55, posY: 80 }
        ]
      },
      back: {
        lineCount: 1,
        lines: [
          { text: "BACK SIDE", font: "'Noto Sans JP', sans-serif", size: 40, posX: 55, posY: 50 },
          { text: "TEL: 090-XXXX", font: "'Noto Sans JP', sans-serif", size: 35, posX: 55, posY: 65 },
          { text: "3RD LINE", font: "'Cinzel', serif", size: 30, posX: 55, posY: 80 }
        ]
      }
    };

    const lineRadios = document.querySelectorAll('input[name="lineCount"]');
    const sideRadios = document.querySelectorAll('input[name="sideMode"]');
    const sideTabContainer = document.getElementById('sideTabContainer');
    const tabFrontBtn = document.getElementById('tabFrontBtn');
    const tabBackBtn = document.getElementById('tabBackBtn');

    const lines = [
      {
        block: document.getElementById('blockLine1'),
        input: document.getElementById('textInput1'),
        font: document.getElementById('fontSelect1'),
        size: document.getElementById('sizeInput1'),
        sizeVal: document.getElementById('sizeVal1'),
        posX: document.getElementById('posXInput1'),
        posXVal: document.getElementById('posXVal1'),
        posY: document.getElementById('posYInput1'),
        posYVal: document.getElementById('posYVal1'),
        prev: document.getElementById('linePrev1')
      },
      {
        block: document.getElementById('blockLine2'),
        input: document.getElementById('textInput2'),
        font: document.getElementById('fontSelect2'),
        size: document.getElementById('sizeInput2'),
        sizeVal: document.getElementById('sizeVal2'),
        posX: document.getElementById('posXInput2'),
        posXVal: document.getElementById('posXVal2'),
        posY: document.getElementById('posYInput2'),
        posYVal: document.getElementById('posYVal2'),
        prev: document.getElementById('linePrev2')
      },
      {
        block: document.getElementById('blockLine3'),
        input: document.getElementById('textInput3'),
        font: document.getElementById('fontSelect3'),
        size: document.getElementById('sizeInput3'),
        sizeVal: document.getElementById('sizeVal3'),
        posX: document.getElementById('posXInput3'),
        posXVal: document.getElementById('posXVal3'),
        posY: document.getElementById('posYInput3'),
        posYVal: document.getElementById('posYVal3'),
        prev: document.getElementById('linePrev3')
      }
    ];

    // 画面の入力をデータ構造に同期
    function saveCurrentControlsToData() {
      let count = 1;
      lineRadios.forEach(r => { if(r.checked) count = parseInt(r.value); });
      sideData[currentSide].lineCount = count;

      lines.forEach((line, index) => {
        sideData[currentSide].lines[index] = {
          text: line.input.value,
          font: line.font.value,
          size: parseInt(line.size.value),
          posX: parseInt(line.posX.value),
          posY: parseInt(line.posY.value)
        };
      });
    }

    // データをコントロール画面に適用
    function loadDataToControls() {
      const data = sideData[currentSide];
      
      lineRadios.forEach(r => {
        r.checked = (parseInt(r.value) === data.lineCount);
      });

      lines.forEach((line, index) => {
        const item = data.lines[index];
        line.input.value = item.text;
        line.font.value = item.font;
        line.size.value = item.size;
        line.posX.value = item.posX;
        line.posY.value = item.posY;
      });

      updatePreviewUI();
    }

    function updatePreviewUI() {
      const data = sideData[currentSide];
      const count = data.lineCount;

      lines.forEach((line, index) => {
        if (index < count) {
          line.block.classList.remove('hidden');
          line.prev.classList.remove('hidden');
          
          line.prev.textContent = line.input.value || ' ';
          line.prev.style.fontFamily = line.font.value;
          line.prev.style.fontSize = line.size.value + 'px';
          line.prev.style.left = line.posX.value + '%';
          line.prev.style.top = line.posY.value + '%';

          line.sizeVal.textContent = line.size.value;
          line.posXVal.textContent = line.posX.value - 55;
          line.posYVal.textContent = line.posY.value - 50;
        } else {
          line.block.classList.add('hidden');
          line.prev.classList.add('hidden');
        }
      });
    }

    // 片面 / 両面 切り替え
    sideRadios.forEach(r => {
      r.addEventListener('change', (e) => {
        isDoubleSided = (e.target.value === 'double');
        if (isDoubleSided) {
          sideTabContainer.classList.remove('hidden');
        } else {
          sideTabContainer.classList.add('hidden');
          switchSide('front'); // 片面時は自動で表面へ
        }
      });
    });

    // タブ切り替え処理
    function switchSide(targetSide) {
      if (currentSide === targetSide) return;
      saveCurrentControlsToData();
      currentSide = targetSide;

      if (currentSide === 'front') {
        tabFrontBtn.classList.add('active');
        tabBackBtn.classList.remove('active');
      } else {
        tabBackBtn.classList.add('active');
        tabFrontBtn.classList.remove('active');
      }

      loadDataToControls();
    }

    tabFrontBtn.addEventListener('click', () => switchSide('front'));
    tabBackBtn.addEventListener('click', () => switchSide('back'));

    // 入力イベント検知
    lineRadios.forEach(r => r.addEventListener('change', () => {
      saveCurrentControlsToData();
      updatePreviewUI();
    }));

    lines.forEach(line => {
      [line.input, line.font, line.size, line.posX, line.posY].forEach(el => el.addEventListener('input', () => {
        saveCurrentControlsToData();
        updatePreviewUI();
      }));
    });

    // 郵便番号からの住所自動入力機能 (Zipcloud API)
    const zipInput = document.getElementById('custZip');
    const addressInput = document.getElementById('custAddress');
    const zipStatus = document.getElementById('zipStatus');

    zipInput.addEventListener('input', async (e) => {
      const zip = e.target.value.replace(/[^\d]/g, '');
      if (zip.length === 7) {
        zipStatus.textContent = '住所を検索中...';
        try {
          const response = await fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${zip}`);
          const data = await response.json();
          if (data.results) {
            const res = data.results[0];
            addressInput.value = `${res.address1}${res.address2}${res.address3}`;
            zipStatus.textContent = '✓ 住所を自動入力しました。以降の番地を入力してください。';
            addressInput.focus();
          } else {
            zipStatus.textContent = '※該当する住所が見つかりませんでした。';
          }
        } catch (err) {
          zipStatus.textContent = '※住所自動取得に失敗しました。直接入力してください。';
        }
      } else {
        zipStatus.textContent = '';
      }
    });

    // キャプチャ画像作成用関数
    async function generateCanvasImageForSide(sideName) {
      saveCurrentControlsToData();
      const tempSide = currentSide;
      
      // 対象面に一時的に切り替えて描画
      currentSide = sideName;
      loadDataToControls();
      await document.fonts.ready;

      const previewArea = document.getElementById('previewArea');
      const canvas = await html2canvas(previewArea, {
        scale: 2,
        useCORS: true,
        logging: false,
        width: previewArea.offsetWidth,
        height: previewArea.offsetHeight,
        onclone: (clonedDoc) => {
          const clonedPreview = clonedDoc.getElementById('previewArea');
          if (clonedPreview) clonedPreview.style.transform = 'none';
        }
      });

      // 元の面に復元
      currentSide = tempSide;
      loadDataToControls();

      return canvas.toDataURL('image/png');
    }

    let capturedFrontImage = "";
    let capturedBackImage = "";

    // 確認モーダルを開く
    document.getElementById('openConfirmBtn').addEventListener('click', async () => {
      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const zip = document.getElementById('custZip').value;
      const address = document.getElementById('custAddress').value;

      if (!name || !phone || !zip || !address) {
        alert('お届け先情報をすべて入力してください。');
        return;
      }

      // 画像の自動キャプチャ
      capturedFrontImage = await generateCanvasImageForSide('front');
      if (isDoubleSided) {
        capturedBackImage = await generateCanvasImageForSide('back');
      } else {
        capturedBackImage = "";
      }

      // モーダル内の画像表示を構成
      const imgGrid = document.getElementById('modalImgGrid');
      imgGrid.innerHTML = `
        <div class="modal-img-wrapper">
          <span class="modal-img-tag">${isDoubleSided ? '表面' : '完成デザイン'}</span>
          <img src="${capturedFrontImage}" alt="表面デザイン">
        </div>
      `;

      if (isDoubleSided && capturedBackImage) {
        imgGrid.innerHTML += `
          <div class="modal-img-wrapper">
            <span class="modal-img-tag">裏面</span>
            <img src="${capturedBackImage}" alt="裏面デザイン">
          </div>
        `;
      }

      document.getElementById('modalInfoText').innerHTML = `
        <strong>刻印種類:</strong> ${isDoubleSided ? '両面刻印' : '片面刻印'}<br>
        <strong>お名前:</strong> ${name}<br>
        <strong>電話番号:</strong> ${phone}<br>
        <strong>ご住所:</strong> 〒${zip} ${address}
      `;

      document.getElementById('confirmModal').classList.remove('hidden');
    });

    // モーダルを閉じる
    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('confirmModal').classList.add('hidden');
    });

    // 注文確定送信
    document.getElementById('finalSubmitBtn').addEventListener('click', async () => {
      const finalBtn = document.getElementById('finalSubmitBtn');
      finalBtn.disabled = true;
      finalBtn.textContent = '送信中...';

      saveCurrentControlsToData();

      const orderData = {
        name: document.getElementById('custName').value,
        phone: document.getElementById('custPhone').value,
        zip: document.getElementById('custZip').value,
        address: document.getElementById('custAddress').value,
        isDoubleSided: isDoubleSided,
        imageDataFront: capturedFrontImage,
        imageDataBack: capturedBackImage,
        frontData: sideData.front,
        backData: isDoubleSided ? sideData.back : null
      };

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(orderData)
        });

        const resData = await response.json();

        if (resData.result === "success") {
          alert(`ご注文ありがとうございました！\n\n【ご注文番号】\n${resData.orderId}\n\n問い合わせの際はこちらの注文番号をお伝えください。`);
          location.reload();
        } else {
          throw new Error("送信エラー");
        }
      } catch (error) {
        alert('ご注文を送信しました！スプレッドシートをご確認ください。');
        location.reload();
      }
    });

    // 初期化
    loadDataToControls();
  </script>
</body>
</html>
